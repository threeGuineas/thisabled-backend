name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: thisabled
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: thisabled_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thisabled -d thisabled_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://thisabled:test-password@127.0.0.1:5432/thisabled_test
      TEST_DATABASE_URL: postgresql+asyncpg://thisabled:test-password@127.0.0.1:5432/thisabled_test
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY: ci-only-secret
      OAUTH_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.26
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-audit.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit -r /tmp/requirements-audit.txt --progress-spinner off
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
