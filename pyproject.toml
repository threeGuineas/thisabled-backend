[project]
name = "thisabled-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.29.0",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.29",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.4",
    "PyJWT[crypto]==2.13.0",
    "python-multipart==0.0.32",
    "httpx==0.27.0",
    "aiofiles==23.2.1",
    "openai==1.30.5",
    "apscheduler==3.10.4",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "httpx2==2.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/thisabled-pytest-cache"
